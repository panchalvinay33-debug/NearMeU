name: NearMeU quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate production release configuration
        run: bash tool/validate_release_config.sh

      - name: Detect permanent Android signing
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_STORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore permanent Android signing
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/nearmeu-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=nearmeu-upload.jks
          EOF
          chmod 600 android/app/nearmeu-upload.jks android/key.properties

      - name: Verify permanent signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          keytool -list -v \
            -keystore android/app/nearmeu-upload.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:'

      - name: Upload resolved Flutter lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Validate changed Dart files with formatter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t dart_files < <(
              git diff --name-only --diff-filter=ACM \
                "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
                -- '*.dart'
            )
          else
            mapfile -t dart_files < <(
              git diff-tree --no-commit-id --name-only -r HEAD -- '*.dart'
            )
          fi

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to validate."
            exit 0
          fi

          printf 'Validating Dart files:\n%s\n' "${dart_files[*]}"
          dart format --output=none "${dart_files[@]}"
          git diff --check -- "${dart_files[@]}"

      - name: Analyze for compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 20m \
            flutter build apk --debug --no-pub 2>&1 \
            | tee android-debug-build.log
          status=${PIPESTATUS[0]}
          set -e

          if (( status == 124 || status == 137 )); then
            echo "Debug APK build exceeded the 20-minute safety limit."
          fi
          exit "$status"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nearmeu-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build permanently signed release APK
        if: steps.signing.outputs.available == 'true'
        run: flutter build apk --release

      - name: Upload permanently signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nearmeu-signed-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build-log
          path: android-debug-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify unsigned release builds are refused
        if: steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          set +e
          release_output=$(flutter build apk --release 2>&1)
          status=$?
          set -e
          printf '%s\n' "$release_output"

          if (( status == 0 )); then
            echo "Release build unexpectedly succeeded without a private keystore."
            exit 1
          fi

          if ! grep -q "Release signing is not configured" <<< "$release_output"; then
            echo "Release build failed for an unexpected reason."
            exit 1
          fi

      - name: Remove restored signing files
        if: always() && steps.signing.outputs.available == 'true'
        shell: bash
        run: rm -f android/app/nearmeu-upload.jks android/key.properties

  functions:
    name: Cloud Functions checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Run function unit tests
        run: npm test --prefix functions

      - name: Load secure function definitions
        run: node -e "require('./functions')"

  firebase-rules:
    name: Firebase rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rule-test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Run Firebase emulator rules tests
        shell: bash
        run: |
          set +e
          firebase emulators:exec \
            --debug \
            --project demo-nearmeu-rules-test \
            --only firestore,storage \
            "npm run test:rules" > firebase-rules-test.log 2>&1
          status=$?
          cat firebase-rules-test.log
          exit "$status"

      - name: Upload Firebase rules diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-rules-test-log
          path: firebase-rules-test.log
          if-no-files-found: error
          retention-days: 7
