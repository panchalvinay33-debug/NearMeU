name: Batch 09 dependency lock resolver

on:
  push:
    branches:
      - batch/09-agora-audio-calling

permissions:
  contents: write

jobs:
  resolve-functions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/09-agora-audio-calling
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve Functions package lock
        run: npm install --package-lock-only --prefix functions --no-audit --no-fund
      - name: Commit exact resolved lock when changed
        shell: bash
        run: |
          if git diff --quiet -- functions/package-lock.json; then
            echo "Functions package lock already resolved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git commit -m "Batch 09: resolve Functions package lock"
          git push origin HEAD:batch/09-agora-audio-calling
