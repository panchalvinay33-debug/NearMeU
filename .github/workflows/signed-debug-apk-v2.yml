name: NearMeU signed debug APK v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/signed-debug-apk-v2.yml'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  build-signed-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install stable debug signing keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.NEARMEU_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | tee debug-signing-certificate.txt
          grep -F "SHA1: 93:99:48:BC:6F:53:7D:78:02:FD:1C:7A:91:F2:47:D5:7A:C6:88:18" debug-signing-certificate.txt
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Verify APK signing certificate
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk | tee apk-signing-certificate.txt
          grep -F "SHA1: 93:99:48:BC:6F:53:7D:78:02:FD:1C:7A:91:F2:47:D5:7A:C6:88:18" apk-signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nearmeu-signed-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
