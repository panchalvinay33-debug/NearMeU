name: NearMeU Android compatibility gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-apk:
    name: Inspect Android SDK, ABI and install filters
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Inspect built APK compatibility
        shell: bash
        run: bash tool/check_android_apk_compatibility.sh build/app/outputs/flutter-apk/app-debug.apk | tee android-compatibility-report.txt

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-${{ github.sha }}
          path: |
            android-compatibility-report.txt
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-matrix:
    name: Emulator smoke API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 33, 35]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Boot emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/android_emulator_smoke.sh build/app/outputs/flutter-apk/app-debug.apk | tee emulator-smoke-api-${{ matrix.api-level }}.txt

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            emulator-smoke-api-${{ matrix.api-level }}.txt
            launch-result.txt
            activity-dump.txt
            process-list.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 7

  low-ram-emulator:
    name: Low-RAM Android smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Boot constrained emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: bash tool/android_emulator_smoke.sh build/app/outputs/flutter-apk/app-debug.apk | tee low-ram-emulator-smoke.txt

      - name: Upload low-RAM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-ram-emulator-smoke-${{ github.sha }}
          path: |
            low-ram-emulator-smoke.txt
            launch-result.txt
            activity-dump.txt
            process-list.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 7
