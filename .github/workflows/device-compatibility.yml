name: NearMeU Android compatibility gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-apk:
    name: Inspect Android SDK, ABI and install filters
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Inspect built APK compatibility
        shell: bash
        run: bash tool/check_android_apk_compatibility.sh build/app/outputs/flutter-apk/app-debug.apk | tee android-compatibility-report.txt

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-${{ github.sha }}
          path: |
            android-compatibility-report.txt
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
