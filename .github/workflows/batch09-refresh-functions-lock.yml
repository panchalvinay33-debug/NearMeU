name: Batch09 refresh functions lockfile

on:
  push:
    branches:
      - batch/09-audio-calling-v2
    paths:
      - functions/package.json
      - .github/workflows/batch09-refresh-functions-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/09-audio-calling-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --prefix functions --no-audit --no-fund
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/package-lock.json
          git commit -m 'Batch09: refresh functions dependency lock'
          git push origin HEAD:batch/09-audio-calling-v2
