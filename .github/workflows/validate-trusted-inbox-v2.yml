name: Validate trusted inbox fix v2

on:
  push:
    branches:
      - agent/trusted-inbox-fallback-v13
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: >-
          dart format
          lib/screens/chats_screen.dart
          lib/services/trusted_read_service.dart
          lib/widgets/unread_nav_icon.dart

      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/chats_screen.dart lib/services/trusted_read_service.dart lib/widgets/unread_nav_icon.dart
            git commit -m "Format trusted inbox Dart files"
            git push
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  functions-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci

      - name: Load function exports
        env:
          FUNCTIONS_CONTROL_API: 'true'
        run: node -e "const exported = require('./bootstrap.js'); console.log(Object.keys(exported).sort().join('\n'));"

      - name: Run functions tests
        run: npm test
