name: NearMeU recovery governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Recovery governance checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required recovery and ecosystem files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/PROJECT_OPERATING_BLUEPRINT.md
            docs/PROJECT_START_DEPLOYMENT_RULES.md
            docs/NEARMEEU_ECOSYSTEM_BOUNDARY.md
            docs/MASTER_PROJECT_AUDIT.md
            docs/CHANGE_LEDGER.md
            docs/OFFICIAL_RECOVERABLE_BASE.md
            docs/EXECUTION_BATCH_PLAN.md
            config/official_base_manifest.json
            config/project_state_manifest.json
            tool/show_project_state.ps1
            tool/restore_official_base.ps1
            tool/verify_deployment_gate.ps1
            tool/audit_production_state.ps1
            tool/promote_official_base.ps1
          )
          for path in "${required[@]}"; do
            [[ -f "$path" ]] || { echo "Missing required recovery/ecosystem file: $path"; exit 1; }
          done

      - name: Validate machine-readable project manifests and permanent operating rules
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const official = JSON.parse(fs.readFileSync('config/official_base_manifest.json', 'utf8'));
          const state = JSON.parse(fs.readFileSync('config/project_state_manifest.json', 'utf8'));
          const boundary = fs.readFileSync('docs/NEARMEEU_ECOSYSTEM_BOUNDARY.md', 'utf8');
          const startRules = fs.readFileSync('docs/PROJECT_START_DEPLOYMENT_RULES.md', 'utf8');
          const fail = (m) => { console.error(m); process.exit(1); };
          if (official.project !== 'NearMeU') fail('official manifest project mismatch');
          if (official.identity.repository !== 'panchalvinay33-debug/NearMeU') fail('repository mismatch');
          if (official.identity.canonicalPcWorkspace !== 'F:\\NearMeU') fail('canonical PC path mismatch');
          if (official.identity.androidApplicationId !== 'com.nearmeu.nearmeu') fail('package mismatch');
          if (official.identity.firebaseProjectId !== 'nearmeu-e82c7') fail('Firebase project mismatch');
          if (official.acceptedProductBoundary.throughBatch !== '08') fail('accepted boundary must remain Base08 during freeze');
          if (!official.acceptedProductBoundary.futureRuntimeWorkLocked) fail('future runtime work must remain locked');
          if (state.developmentState.acceptedThroughBatch !== '08') fail('project state accepted boundary mismatch');
          if (!state.developmentState.futureRuntimeWorkLocked) fail('project state future-work lock missing');
          if (!state.developmentState.permanentStartAndDeploymentRulesEnabled) fail('permanent start/deployment governance flag missing');
          if (state.officialTruth.projectStartDeploymentRules !== 'docs/PROJECT_START_DEPLOYMENT_RULES.md') fail('project start/deployment source-of-truth mismatch');
          if (state.identity.androidApplicationId !== official.identity.androidApplicationId) fail('manifest package mismatch');
          if (state.identity.firebaseProjectId !== official.identity.firebaseProjectId) fail('manifest Firebase mismatch');
          if (state.identity.versionName !== official.identity.versionName || state.identity.versionCode !== official.identity.versionCode) fail('manifest version mismatch');
          if (!state.ecosystem) fail('ecosystem metadata missing');
          if (state.ecosystem.consumerRepository !== 'panchalvinay33-debug/NearMeU') fail('consumer repo ecosystem mismatch');
          if (state.ecosystem.adminRepository !== 'panchalvinay33-debug/NearMeU-Admin') fail('Admin companion repo mismatch');
          if (state.ecosystem.consumerAndroidApplicationId !== 'com.nearmeu.nearmeu') fail('consumer package ecosystem mismatch');
          if (state.ecosystem.adminAndroidApplicationId !== 'com.nearmeu.admin') fail('Admin package ecosystem mismatch');
          if (state.ecosystem.sharedFirebaseProjectId !== official.identity.firebaseProjectId) fail('shared Firebase ecosystem mismatch');
          if (state.ecosystem.sharedBackendOwnerRepository !== 'panchalvinay33-debug/NearMeU') fail('shared backend owner mismatch');
          if (state.ecosystem.adminDevelopmentStatus !== 'PAUSED_UNTIL_CONSUMER_PUBLIC_LAUNCH_OWNER_RESUME') fail('Admin pause state changed without governance update');
          const roadmap = state.futureRoadmap?.plannedBatches || [];
          const expectedRoadmap = [
            ['09','Audio Calling'],
            ['10','Video Calling'],
            ['11','Google Play Premium Verification'],
            ['12','Production Hardening'],
            ['13','Play Store Internal and Closed Testing'],
            ['14','Controlled Public Launch'],
            ['15','NearMeU Admin Full Development and Integration'],
          ];
          if (roadmap.length !== expectedRoadmap.length) fail('future roadmap batch count mismatch');
          for (let i = 0; i < expectedRoadmap.length; i++) {
            if (roadmap[i].id !== expectedRoadmap[i][0] || roadmap[i].name !== expectedRoadmap[i][1]) fail(`future roadmap mismatch at Batch ${expectedRoadmap[i][0]}`);
          }
          if (roadmap[6].status !== 'locked-after-public-launch') fail('Admin Batch15 must remain locked until after public launch');
          for (const requiredText of ['NearMeU-Admin','reference','deploy','PAUSED']) {
            if (!boundary.includes(requiredText)) fail(`ecosystem boundary missing required concept: ${requiredText}`);
          }
          for (const requiredText of ['Production deployment ownership','accepted base','NearMeU-Admin','Batch15','Permanent operating-system rule']) {
            if (!startRules.includes(requiredText)) fail(`project start/deployment rules missing required concept: ${requiredText}`);
          }
          console.log('Machine-readable recovery/project/ecosystem/start-deployment state is internally consistent.');
          NODE

      - name: Validate pubspec version matches official manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const official = JSON.parse(fs.readFileSync('config/official_base_manifest.json', 'utf8'));
          const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
          const expected = `version: ${official.identity.versionName}+${official.identity.versionCode}`;
          if (!pubspec.includes(expected)) {
            console.error(`pubspec.yaml does not contain expected ${expected}`);
            process.exit(1);
          }
          console.log(`pubspec matches ${expected}`);
          NODE

      - name: Validate PowerShell recovery tooling parses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tool/show_project_state.ps1',
            'tool/restore_official_base.ps1',
            'tool/verify_deployment_gate.ps1',
            'tool/audit_production_state.ps1',
            'tool/promote_official_base.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax OK"
          }

      - name: Validate accepted Cloud Functions source loads
        shell: bash
        run: |
          npm ci --prefix functions --no-audit --no-fund
          node - <<'NODE'
          const exported = Object.keys(require('./functions/bootstrap.js')).sort();
          if (!exported.length) {
            console.error('No accepted function exports found.');
            process.exit(1);
          }
          const forbidden = exported.filter((name) => /admin|agora|audioCall|videoCall|callSession/i.test(name));
          if (forbidden.length) {
            console.error('Post-Base08/Admin function export detected during consumer Base08 freeze:', forbidden);
            process.exit(1);
          }
          console.log(`Accepted Base08 consumer/shared-backend function exports load: ${exported.length}`);
          NODE
