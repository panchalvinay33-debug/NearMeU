name: Apply NearMeU runtime fixes once

on:
  pull_request:
    branches:
      - main
    paths:
      - tool/apply_runtime_fix.py
      - .github/workflows/runtime-fix-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply asserted runtime patch
        run: python3 tool/apply_runtime_fix.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/chats_screen.dart \
            lib/screens/chat_screen.dart \
            lib/screens/settings_screen.dart \
            lib/services/private_media_service.dart \
            lib/widgets/chat/private_media_content.dart \
            lib/widgets/chat/message_bubble.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Commit verified fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git restore pubspec.lock
          git diff --check
          git config user.name "NearMeU Runtime Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/screens/chats_screen.dart \
            lib/screens/chat_screen.dart \
            lib/screens/settings_screen.dart \
            lib/services/private_media_service.dart \
            lib/widgets/chat/private_media_content.dart \
            lib/widgets/chat/message_bubble.dart
          git commit -m "Fix profile avatars and preserve downloaded media"
          git push origin "HEAD:${HEAD_BRANCH}"
