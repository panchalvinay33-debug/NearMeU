name: Batch09 v3 refresh functions lock

on:
  pull_request:
    branches:
      - main
    paths:
      - functions/package.json
      - functions/package-lock.json
      - .github/workflows/batch09-refresh-functions-lock-v3.yml
  push:
    branches:
      - batch/09-audio-calling-v3
    paths:
      - functions/package.json
      - .github/workflows/batch09-refresh-functions-lock-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Regenerate functions lockfile from package.json
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean npm install
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: Commit regenerated lockfile on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- functions/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git commit -m "Batch09 v3: regenerate functions package lock"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: batch09-v3-functions-lock
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 7
