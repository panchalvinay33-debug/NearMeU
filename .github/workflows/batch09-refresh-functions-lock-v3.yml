name: Batch09 v3 refresh functions lock

on:
  push:
    branches:
      - batch/09-audio-calling-v3
    paths:
      - functions/package.json
      - .github/workflows/batch09-refresh-functions-lock-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Regenerate functions lockfile from package.json
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean npm install
        working-directory: functions
        run: npm ci --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: batch09-v3-functions-lock
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 7
